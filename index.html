<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Madeline Tree</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
  canvas{display:block}
  #hint{position:fixed;left:0;right:0;bottom:10px;text-align:center;
        font:600 12px "Segoe UI",system-ui,sans-serif;color:#7fc6ff;
        letter-spacing:2px;opacity:.5;pointer-events:none;text-transform:uppercase}
  #music-btn {
    position: fixed; right: 20px; bottom: 20px; z-index: 999;
    background: rgba(10, 15, 30, 0.8); border: 2px solid #00f5ff;
    color: #00f5ff; width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; box-shadow: 0 0 15px rgba(0,245,255,0.4);
    transition: all 0.3s ease; user-select: none;
  }
  #music-btn:hover { background: #00f5ff; color: #000; box-shadow: 0 0 25px #00f5ff; }
  #music-btn.playing { border-color: #ff00d4; color: #ff00d4; box-shadow: 0 0 15px rgba(255,0,212,0.4); }
  #music-btn.playing:hover { background: #ff00d4; color: #000; box-shadow: 0 0 25px #ff00d4; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click o tecla R para repetir</div>
<audio id="bgm" src="teeth.mp3" loop preload="auto"></audio>
<div id="music-btn" title="Reproducir / Pausar Música">🎵</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, W < 900 ? 1.6 : 2);
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  start();
}

const PAL = ['#00f5ff', '#ff00d4', '#b6ff00', '#ff9b00', '#ff2d95', '#9d4bff', '#39ff88'];
const NAME = 'Madeline';

const T = {
  sprout: 1100,
  growStart: 1100,
  growEnd: 6400,
  bloomStart: 5200,
  fallAt: 8600,
  wordIn: 11600,
  wordFull: 13400,
  fwStart: 13900,
  fwEnd: 19300,
  restart: 20000
};

const MAX_BRANCH = 1500;
const MAX_LEAF = 1500;
const SNOW_STEP = 24;
const SPRITE = 64;
const MAX_SPARKS = 850;

let branches = [], leaves = [], wordPts = [];
let glowSprites = {}, leafSprites = {};
let groundPts = [], dirtDots = [], dirtPatches = [], stars = [];
let snowBack = [], snowFront = [];
let skyGrad = null;
let groundCv = null, moonCv = null, wordArt = null, moonPos = null;
let rockets = [], sparks = [], nextFw = 0, finaleDone = false;
let base = { x: 0, y: 0 };
let wordFont = '', t0 = 0, lastNow = 0, ready = false;

let fpsSum = 0, fpsN = 0, fpsChecked = false;

function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInQuad(t) { return t * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

function initGlow() {
  glowSprites = {};
  for (const col of PAL.concat(['#ffffff'])) {
    const s = document.createElement('canvas');
    s.width = s.height = SPRITE;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, col);
    grad.addColorStop(0.35, col + 'aa');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, SPRITE, SPRITE);
    glowSprites[col] = s;
  }
}

function buildLeafSprites() {
  leafSprites = {};
  for (const col of PAL) {
    const arr = [];
    for (let k = 0; k < 8; k++) {
      const c = document.createElement('canvas');
      c.width = c.height = SPRITE;
      const g = c.getContext('2d');
      g.translate(SPRITE / 2, SPRITE / 2);
      g.rotate(k * Math.PI / 4);
      const grad = g.createRadialGradient(0, 0, 0, 0, 0, 26);
      grad.addColorStop(0, col);
      grad.addColorStop(0.4, col + 'aa');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grad;
      g.beginPath();
      g.arc(0, 0, 26, 0, 6.283);
      g.fill();
      g.beginPath();
      g.ellipse(0, 0, 10, 5.5, 0, 0, 6.283);
      g.fillStyle = col;
      g.fill();
      g.globalAlpha = 0.6;
      g.beginPath();
      g.ellipse(-2, -1.2, 4.5, 2.4, 0, 0, 6.283);
      g.fillStyle = '#ffffff';
      g.fill();
      arr.push(c);
    }
    leafSprites[col] = arr;
  }
}

function groundYAt(x) {
  if (!groundPts.length) return H * 0.875;
  const i = clamp(Math.floor(x / SNOW_STEP), 0, groundPts.length - 2);
  const a = groundPts[i], b = groundPts[i + 1];
  const t = (b.x - a.x) === 0 ? 0 : (x - a.x) / (b.x - a.x);
  return lerp(a.y, b.y, t);
}

function buildGround() {
  groundPts = [];
  for (let x = 0; x <= W + SNOW_STEP; x += SNOW_STEP) {
    const y = H * 0.875 + Math.sin(x * 0.0042) * 9 + Math.sin(x * 0.0135 + 1.7) * 5;
    groundPts.push({ x, y });
  }

  dirtDots = [];
  for (let i = 0; i < 380; i++) {
    const x = Math.random() * W;
    const top = groundYAt(x) + 5;
    if (top >= H - 4) continue;
    dirtDots.push({
      x, y: rnd(top, H - 3),
      r: rnd(1, 3.4),
      c: Math.random() < 0.5 ? 0 : 1
    });
  }

  dirtPatches = [];
  for (let i = 0; i < 26; i++) {
    const x = rnd(W * 0.03, W * 0.97);
    dirtPatches.push({ x, y: groundYAt(x) + rnd(1, 14), rx: rnd(9, 30), ry: rnd(3.5, 9) });
  }

  stars = [];
  for (let i = 0; i < 55; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, r: rnd(0.5, 1.6), a: rnd(0.15, 0.6), ph: Math.random() * 6.28 });
  }

  skyGrad = ctx.createRadialGradient(W * 0.5, H * 0.95, 0, W * 0.5, H * 0.95, Math.max(W, H) * 0.72);
  skyGrad.addColorStop(0, 'rgba(18,52,86,0.55)');
  skyGrad.addColorStop(0.45, 'rgba(8,24,44,0.35)');
  skyGrad.addColorStop(1, 'rgba(0,0,0,0)');

  buildGroundCv();
  buildMoonCv();
}

function paintGround(g) {
  if (groundPts.length < 2) return;

  g.beginPath();
  g.moveTo(groundPts[0].x, groundPts[0].y);
  for (const p of groundPts) g.lineTo(p.x, p.y);
  g.lineTo(W, H);
  g.lineTo(0, H);
  g.closePath();
  g.fillStyle = '#3a2415';
  g.fill();

  g.save();
  g.clip();
  for (let c = 0; c < 2; c++) {
    g.fillStyle = c === 0 ? 'rgba(26,15,8,0.85)' : 'rgba(96,64,38,0.7)';
    g.beginPath();
    let any = false;
    for (const d of dirtDots) {
      if (d.c !== c) continue;
      g.moveTo(d.x + d.r, d.y);
      g.arc(d.x, d.y, d.r, 0, 6.283);
      any = true;
    }
    if (any) g.fill();
  }
  g.restore();

  const A = -15, B = 6;
  g.beginPath();
  g.moveTo(0, groundPts[0].y + A);
  for (const p of groundPts) g.lineTo(p.x, p.y + A);
  for (let i = groundPts.length - 1; i >= 0; i--) g.lineTo(groundPts[i].x, groundPts[i].y + B);
  g.closePath();
  const sg = g.createLinearGradient(0, H * 0.85, 0, H);
  sg.addColorStop(0, '#ffffff');
  sg.addColorStop(0.5, '#e8f3ff');
  sg.addColorStop(1, '#bcd6ec');
  g.fillStyle = sg;
  g.fill();

  g.beginPath();
  g.moveTo(0, groundPts[0].y + A);
  for (const p of groundPts) g.lineTo(p.x, p.y + A);
  g.lineWidth = 2.4;
  g.strokeStyle = 'rgba(160,225,255,0.9)';
  g.stroke();

  g.globalAlpha = 0.8;
  g.fillStyle = '#4a3018';
  g.beginPath();
  for (const d of dirtPatches) {
    g.moveTo(d.x + d.rx, d.y);
    g.ellipse(d.x, d.y, d.rx, d.ry, 0, 0, 6.283);
  }
  g.fill();
  g.globalAlpha = 1;

  g.fillStyle = 'rgba(120,132,148,0.75)';
  g.beginPath();
  for (let i = 0; i < 22; i++) {
    const x = (i * 137.5) % W;
    const y = groundYAt(x) + 10 + ((i * 53) % 26);
    if (y > H - 2) continue;
    const rx = 3 + (i % 3), ry = 2 + (i % 2);
    g.moveTo(x + rx, y);
    g.ellipse(x, y, rx, ry, 0, 0, 6.283);
  }
  g.fill();
}

function buildGroundCv() {
  groundCv = document.createElement('canvas');
  groundCv.width = Math.floor(W * DPR);
  groundCv.height = Math.floor(H * DPR);
  const g = groundCv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintGround(g);
}

function buildMoonCv() {
  const R = Math.min(W, H) * 0.13;
  const halo = R * 3.1;
  const size = halo * 2;
  const hx = halo - R * 0.45, hy = halo + R * 0.32, hr = R * 0.99;

  moonCv = document.createElement('canvas');
  moonCv.width = moonCv.height = Math.ceil(size * DPR);
  moonPos = { x: W * 0.865, y: H * 0.16, size };
  const g = moonCv.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  const gr = g.createRadialGradient(halo, halo, R * 0.5, halo, halo, halo);
  gr.addColorStop(0, 'rgba(120,240,255,0.32)');
  gr.addColorStop(0.4, 'rgba(0,180,255,0.13)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath();
  g.arc(halo, halo, halo, 0, 6.283);
  g.fill();

  g.save();
  g.shadowColor = '#00f5ff';
  g.shadowBlur = 46;
  const bg = g.createLinearGradient(halo - R, halo - R, halo + R, halo + R);
  bg.addColorStop(0, 'rgba(255,255,255,1)');
  bg.addColorStop(1, 'rgba(150,245,255,0.92)');
  g.fillStyle = bg;
  g.beginPath();
  g.arc(halo, halo, R, 0, 6.283);
  g.arc(hx, hy, hr, 0, 6.283);
  g.fill('evenodd');

  g.clip('evenodd');
  g.shadowBlur = 24;
  g.strokeStyle = 'rgba(0,255,245,1)';
  g.lineWidth = 2.6;
  g.beginPath();
  g.arc(halo, halo, R, 0, 6.283);
  g.stroke();
  g.beginPath();
  g.arc(hx, hy, hr, 0, 6.283);
  g.stroke();
  g.restore();
}

function makeFlakes(n, k) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const a = rnd(0.3, 0.95) * k;
    arr.push({
      x: Math.random() * W, y: Math.random() * H,
      r: rnd(0.9, 4.2) * k, sp: rnd(18, 105) * k, drift: rnd(10, 42) * k,
      ph: Math.random() * 6.28, a: a,
      b: a < 0.45 ? 0 : (a < 0.7 ? 1 : 2)
    });
  }
  return arr;
}

function buildSnow() {
  snowBack = makeFlakes(130, 0.55);
  snowFront = makeFlakes(100, 1);
}

function addLeaf(x, y, depth) {
  if (leaves.length >= MAX_LEAF) return;
  leaves.push({
    x, y, depth,
    color: PAL[(Math.random() * PAL.length) | 0],
    size: rnd(6.5, 11),
    rot: Math.random() * 6.283,
    spin: rnd(-4, 4),
    ph: Math.random() * Math.PI * 2,
    amp: rnd(5, 30),
    finalRot: rnd(-0.6, 0.6),
    bloomAt: 0, bloomDur: 800,
    fallT0: 0, fallDur: 0, settleDur: 0,
    sx: 0, sy: 0, mx: 0, my: 0, tx: 0, ty: 0,
    started: false
  });
}

function buildTree() {
  branches = [];
  leaves = [];
  base = { x: W / 2, y: groundYAt(W / 2) - 3 };

  function grow(x, y, ang, len, depth, tt0) {
    if (branches.length > MAX_BRANCH) return;
    const dur = 210 + len * 1.15;
    const tt1 = tt0 + dur;
    const x2 = x + Math.cos(ang) * len;
    const y2 = y + Math.sin(ang) * len;
    branches.push({
      x, y, x2, y2, len, depth, t0: tt0, t1: tt1,
      snow: rnd(1.3, 2.7)
    });

    if (depth >= 8 || len < 10) { addLeaf(x2, y2, depth); return; }
    if (depth >= 4 && Math.random() < 0.7) addLeaf(x2, y2, depth);

    const n = depth < 2 ? 2 : (Math.random() < 0.6 ? 2 : 3);
    const spread = 0.5 + depth * 0.09;
    for (let i = 0; i < n; i++) {
      const a = ang + rnd(-spread, spread) + (ang > -Math.PI / 2 ? 0.05 : -0.05);
      grow(x2, y2, a, len * rnd(0.70, 0.79), depth + 1, tt0 + dur * 0.72);
    }
  }

  grow(base.x, base.y, -Math.PI / 2, H * 0.17, 0, 0);

  let maxT = 0;
  for (const b of branches) maxT = Math.max(maxT, b.t1);
  const scale = (T.growEnd - T.growStart) / maxT;
  for (const b of branches) { b.t0 = T.growStart + b.t0 * scale; b.t1 = T.growStart + b.t1 * scale; }

  const tips = branches.filter(b => b.depth >= 6);
  for (const b of tips) {
    const k = 5 + ((Math.random() * 5) | 0);
    for (let i = 0; i < k; i++) {
      const a = Math.random() * 6.283;
      const r = rnd(7, 33);
      addLeaf(b.x2 + Math.cos(a) * r, b.y2 + Math.sin(a) * r * 0.85, b.depth);
    }
  }
  const medios = branches.filter(b => b.depth === 5);
  for (const b of medios) {
    if (Math.random() > 0.55) continue;
    const k = 2 + ((Math.random() * 4) | 0);
    for (let i = 0; i < k; i++) {
      const p = rnd(0.3, 1);
      const a = Math.random() * 6.283;
      const r = rnd(6, 22);
      addLeaf(lerp(b.x, b.x2, p) + Math.cos(a) * r, lerp(b.y, b.y2, p) + Math.sin(a) * r * 0.85, b.depth);
    }
  }

  if (leaves.length < 300) {
    for (let i = 0; i < 500 && leaves.length < 420; i++) {
      const b = branches[(Math.random() * branches.length) | 0];
      if (!b || b.depth < 3) continue;
      const p = rnd(0.4, 1);
      addLeaf(lerp(b.x, b.x2, p), lerp(b.y, b.y2, p), b.depth);
    }
  }

  for (const l of leaves) {
    l.bloomAt = T.bloomStart + rnd(0, 1700) + (l.depth >= 6 ? 400 : 0);
    l.fallT0 = T.fallAt + rnd(0, 1000);
    l.fallDur = rnd(1500, 2100);
    l.settleDur = rnd(700, 1150);
  }
}

function buildWord() {
  const off = document.createElement('canvas');
  off.width = Math.floor(W);
  off.height = Math.floor(H);
  const o = off.getContext('2d');
  let size = Math.min(W * 0.34, H * 0.46);
  const setFont = () => {
    wordFont = 'italic 900 ' + size + 'px "Segoe UI", Arial, sans-serif';
    o.font = wordFont;
  };
  setFont();
  const tw = o.measureText(NAME).width;
  if (tw > 0 && tw > W * 0.86) {
    size *= (W * 0.86) / tw;
    setFont();
  }
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  o.fillStyle = '#fff';
  o.fillText(NAME, W / 2, H * 0.54);

  const d = o.getImageData(0, 0, off.width, off.height).data;
  const pts = [];
  const step = 4;
  for (let y = 0; y < off.height; y += step) {
    for (let x = 0; x < off.width; x += step) {
      if (d[(y * off.width + x) * 4 + 3] > 128) pts.push({ x, y });
    }
  }
  for (let i = pts.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp;
  }
  wordPts = pts;

  for (let i = 0; i < leaves.length; i++) {
    const p = pts.length ? pts[i % pts.length] : { x: W / 2, y: H * 2 };
    const jx = i >= pts.length ? rnd(-4, 4) : 0;
    const jy = i >= pts.length ? rnd(-4, 4) : 0;
    leaves[i].tx = p.x + jx;
    leaves[i].ty = p.y + jy;
  }

  wordArt = document.createElement('canvas');
  wordArt.width = Math.floor(W * DPR);
  wordArt.height = Math.floor(H * DPR);
  const a = wordArt.getContext('2d');
  a.setTransform(DPR, 0, 0, DPR, 0, 0);
  a.font = wordFont;
  a.textAlign = 'center';
  a.textBaseline = 'middle';
  a.shadowColor = '#00f5ff';
  a.shadowBlur = 45;
  a.lineWidth = Math.max(2, Math.min(W, H) * 0.004);
  a.strokeStyle = 'rgba(255,0,212,0.75)';
  a.strokeText(NAME, W / 2, H * 0.54);
  a.fillStyle = 'rgba(233,255,255,0.20)';
  a.fillText(NAME, W / 2, H * 0.54);
}

function fwReset() {
  rockets = [];
  sparks = [];
  nextFw = T.fwStart;
  finaleDone = false;
}

function spawnRocket(t, tx, ty) {
  rockets.push({
    sx: rnd(W * 0.1, W * 0.9), sy: H + 6,
    tx: tx !== undefined ? tx : rnd(W * 0.12, W * 0.88),
    ty: ty !== undefined ? ty : rnd(H * 0.1, H * 0.42),
    t0: t, dur: rnd(900, 1300), curve: rnd(-70, 70),
    col: PAL[(Math.random() * PAL.length) | 0]
  });
}

function explode(x, y, col, t) {
  const n = 44 + ((Math.random() * 26) | 0);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283;
    const sp = rnd(50, 250) * (Math.random() < 0.25 ? 0.45 : 1);
    sparks.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      col: Math.random() < 0.18 ? '#ffffff' : col,
      born: t, life: rnd(900, 1900),
      size: rnd(7, 17), u: 0
    });
  }
  sparks.push({ flash: true, x, y, col, born: t, life: 400, size: rnd(150, 220), u: 0 });
}

function updateFireworks(t, dt) {
  if (t >= T.fwStart && t <= T.fwEnd && t >= nextFw && sparks.length < MAX_SPARKS) {
    const n = Math.random() < 0.3 ? 2 : 1;
    for (let i = 0; i < n; i++) spawnRocket(t + i * 170);
    nextFw = t + rnd(520, 1050);
  }
  if (!finaleDone && t >= T.fwEnd - 400) {
    finaleDone = true;
    for (let i = 0; i < 4; i++) spawnRocket(t + i * 220, W * (0.2 + i * 0.2), rnd(H * 0.1, H * 0.35));
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    if (t - r.t0 >= r.dur) {
      explode(r.tx, r.ty, r.col, t);
      rockets.splice(i, 1);
    }
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    const age = t - s.born;
    if (age > s.life) { sparks.splice(i, 1); continue; }
    s.u = age / s.life;
    if (!s.flash) {
      const drag = Math.exp(-1.6 * dt);
      s.vx *= drag;
      s.vy = s.vy * drag + 215 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
    }
  }
}

function drawFireworks(t) {
  for (const r of rockets) {
    const u = clamp((t - r.t0) / r.dur, 0, 1);
    for (let k = 3; k >= 0; k--) {
      const uu = clamp(u - k * 0.035, 0, 1);
      const x = lerp(r.sx, r.tx, uu) + Math.sin(uu * Math.PI) * r.curve;
      const y = lerp(r.sy, r.ty, uu);
      const sz = k === 0 ? 20 : 13 - k * 2.5;
      ctx.globalAlpha = k === 0 ? 0.95 : 0.5 - k * 0.13;
      ctx.drawImage(glowSprites[r.col], x - sz / 2, y - sz / 2, sz, sz);
    }
  }

  for (const s of sparks) {
    let al;
    if (s.flash) al = (1 - s.u) * (1 - s.u) * 0.85;
    else al = s.u < 0.2 ? 1 : (1 - s.u) / 0.8;
    ctx.globalAlpha = clamp(al, 0, 1);
    const sz = s.size * (s.flash ? 1 - s.u * 0.35 : 1 - s.u * 0.55);
    ctx.drawImage(glowSprites[s.col], s.x - sz / 2, s.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function start() {
  initGlow();
  buildLeafSprites();
  buildGround();
  buildSnow();
  buildTree();
  buildWord();
  fwReset();
  ready = branches.length > 0 && leaves.length > 0;
  t0 = performance.now();
  lastNow = t0;
  fpsSum = 0; fpsN = 0; fpsChecked = false;
}

function pruneLeaves() {
  const avg = fpsN > 0 ? fpsN / fpsSum : 60;
  fpsChecked = true;
  if (avg >= 42) return;
  const keep = avg < 26 ? 2 : 3;
  leaves = leaves.filter((l, i) => i % keep !== 0);
  logInfo('rendimiento bajo (fps ' + avg.toFixed(0) + '), hojas reducidas a ' + leaves.length);
}

function logInfo(m) { console.log(m); }

function swayAt(t) {
  if (t < T.fallAt) return Math.sin(t * 0.0011) * 0.016;
  const k = clamp((t - T.fallAt) / 1600, 0, 1);
  return Math.sin(T.fallAt * 0.0011) * 0.016 * (1 - k);
}

function rot(px, py, ang) {
  const dx = px - base.x, dy = py - base.y;
  const c = Math.cos(ang), s = Math.sin(ang);
  return { x: base.x + dx * c - dy * s, y: base.y + dx * s + dy * c };
}

function drawSky(t) {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    const tw = 0.65 + Math.sin(t * 0.002 + s.ph) * 0.35;
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#dff1ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawMoon(t) {
  if (!moonCv) return;
  const pulse = 0.75 + Math.sin(t * 0.0013) * 0.25;
  ctx.globalAlpha = 0.72 + 0.28 * pulse;
  ctx.drawImage(moonCv, moonPos.x - moonPos.size / 2, moonPos.y - moonPos.size / 2, moonPos.size, moonPos.size);
  ctx.globalAlpha = 1;
}

const SNOW_A = [0.35, 0.6, 0.92];

function updateAndDrawSnow(list, dt, t, col) {
  ctx.fillStyle = col;
  for (let b = 0; b < 3; b++) {
    ctx.globalAlpha = SNOW_A[b];
    ctx.beginPath();
    let any = false;
    for (const f of list) {
      f.y += f.sp * dt;
      f.x += Math.sin(t * 0.0009 + f.ph) * f.drift * dt;
      if (f.y > H + 6) { f.y = -6; f.x = Math.random() * W; }
      if (f.x > W + 8) f.x = -8;
      else if (f.x < -8) f.x = W + 8;
      if (f.b !== b) continue;
      ctx.moveTo(f.x + f.r, f.y);
      ctx.arc(f.x, f.y, f.r, 0, 6.283);
      any = true;
    }
    if (any) ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSprout(t) {
  const p = clamp(t / T.sprout, 0, 1);
  const fade = 1 - clamp((t - 1400) / 900, 0, 1);
  if (fade <= 0) return;
  const gy = groundYAt(base.x) - 8;

  ctx.save();
  ctx.lineCap = 'round';

  ctx.globalAlpha = fade * 0.95;
  ctx.beginPath();
  ctx.ellipse(base.x, gy - 4, 9, 6.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#241207';
  ctx.fill();
  ctx.lineWidth = 1.6;
  ctx.strokeStyle = '#39ff88';
  ctx.stroke();

  const top = gy - H * 0.055 * p;
  ctx.globalAlpha = fade;
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(57,255,136,0.25)';
  ctx.beginPath(); ctx.moveTo(base.x, gy - 4); ctx.lineTo(base.x, top); ctx.stroke();
  ctx.lineWidth = 2.8;
  ctx.strokeStyle = '#39ff88';
  ctx.beginPath(); ctx.moveTo(base.x, gy - 4); ctx.lineTo(base.x, top); ctx.stroke();

  if (p > 0.45) {
    const hp = clamp((p - 0.45) / 0.55, 0, 1);
    const s = 8 * hp;
    ctx.fillStyle = '#b6ff00';
    ctx.shadowColor = '#b6ff00';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.ellipse(base.x - s, top + s * 0.4, s, s * 0.5, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(base.x + s, top + s * 0.4, s, s * 0.5, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawTree(t) {
  const ang = swayAt(t);
  ctx.save();
  ctx.translate(base.x, base.y);
  ctx.rotate(ang);
  ctx.translate(-base.x, -base.y);
  ctx.lineCap = 'round';

  const buckets = [];
  for (const b of branches) {
    if (t < b.t0) continue;
    const p = clamp((t - b.t0) / (b.t1 - b.t0), 0, 1);
    if (p <= 0) continue;
    const ex = lerp(b.x, b.x2, p);
    const ey = lerp(b.y, b.y2, p);
    let bk = buckets[b.depth];
    if (!bk) bk = buckets[b.depth] = { segs: [], snow: [], tips: [], depth: b.depth };
    bk.segs.push(b.x, b.y, ex, ey);
    if (p > 0.25) bk.snow.push(b.x, b.y - b.snow, ex, ey - b.snow);
    if (p < 1) bk.tips.push(ex, ey);
  }

  for (const bk of buckets) {
    if (!bk) continue;
    const w = Math.max(1.7, (9 - bk.depth) * 2.0);
    const hue = 175 + bk.depth * 21;
    const col = 'hsl(' + hue + ',100%,55%)';
    const hot = 'hsl(' + hue + ',100%,84%)';
    const segs = bk.segs;

    ctx.globalAlpha = 0.22;
    ctx.lineWidth = w * 3.6;
    ctx.strokeStyle = col;
    ctx.beginPath();
    for (let i = 0; i < segs.length; i += 4) { ctx.moveTo(segs[i], segs[i + 1]); ctx.lineTo(segs[i + 2], segs[i + 3]); }
    ctx.stroke();

    ctx.globalAlpha = 0.95;
    ctx.lineWidth = w;
    ctx.beginPath();
    for (let i = 0; i < segs.length; i += 4) { ctx.moveTo(segs[i], segs[i + 1]); ctx.lineTo(segs[i + 2], segs[i + 3]); }
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(0.8, w * 0.3);
    ctx.strokeStyle = hot;
    ctx.beginPath();
    for (let i = 0; i < segs.length; i += 4) { ctx.moveTo(segs[i], segs[i + 1]); ctx.lineTo(segs[i + 2], segs[i + 3]); }
    ctx.stroke();

    if (bk.snow.length) {
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = Math.max(1, w * 0.5);
      ctx.strokeStyle = '#f2f9ff';
      ctx.beginPath();
      const sn = bk.snow;
      for (let i = 0; i < sn.length; i += 4) { ctx.moveTo(sn[i], sn[i + 1]); ctx.lineTo(sn[i + 2], sn[i + 3]); }
      ctx.stroke();
    }

    if (bk.tips.length) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = hot;
      const tp = bk.tips;
      for (let i = 0; i < tp.length; i += 2) {
        ctx.moveTo(tp[i] + w * 0.95, tp[i + 1]);
        ctx.arc(tp[i], tp[i + 1], w * 0.95, 0, 6.283);
      }
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawGround() {
  if (groundCv) ctx.drawImage(groundCv, 0, 0, W, H);
}

function drawLeaves(t) {
  const ang = swayAt(t);
  const wordScale = clamp(W * 0.00062, 0.5, 0.95);

  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    if (t < l.bloomAt) continue;
    const bp = clamp((t - l.bloomAt) / l.bloomDur, 0, 1);
    const bloom = bp < 1 ? easeOutBack(bp) : 1;
    const pulse = 1 + Math.sin(t * 0.004 + l.ph) * 0.07;

    let x, y, rotv, sc, alpha;

    if (t < l.fallT0) {
      const p = rot(l.x, l.y, ang);
      x = p.x; y = p.y;
      rotv = l.rot + Math.sin(t * 0.002 + l.ph) * 0.25;
      sc = bloom * pulse; alpha = bp;
    } else {
      if (!l.started) {
        l.started = true;
        const p = rot(l.x, l.y, ang);
        l.sx = p.x; l.sy = p.y;
        l.mx = l.tx + rnd(-45, 45);
        l.my = Math.max(l.ty - rnd(55, 165), l.sy + 12);
      }
      const u = clamp((t - l.fallT0) / l.fallDur, 0, 1);
      if (u < 1) {
        y = lerp(l.sy, l.my, easeInQuad(u));
        x = lerp(l.sx, l.mx, u) + Math.sin(u * Math.PI * 2 + l.ph) * l.amp * (1 - u);
        rotv = l.rot + u * l.spin;
        sc = pulse; alpha = 1;
      } else {
        const v = clamp((t - l.fallT0 - l.fallDur) / l.settleDur, 0, 1);
        const e = easeOutCubic(v);
        x = lerp(l.mx, l.tx, e);
        y = lerp(l.my, l.ty, e);
        rotv = lerp(l.rot + l.spin, l.finalRot, e);
        sc = lerp(pulse, wordScale, e);
        alpha = 1;
        if (v >= 1) {
          x += Math.sin(t * 0.002 + l.ph) * 1.5;
          y += Math.cos(t * 0.0017 + l.ph) * 1.5;
        }
      }
    }

    const spr = leafSprites[l.color][((rotv / 6.283 * 8) | 0) & 7];
    const s = (l.size * sc) * 6.4;
    ctx.globalAlpha = alpha;
    ctx.drawImage(spr, x - s / 2, y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
}

function drawWord(t) {
  if (!wordArt) return;
  const a = clamp((t - T.wordIn) / (T.wordFull - T.wordIn), 0, 1);
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.drawImage(wordArt, 0, 0, W, H);
  ctx.globalAlpha = 1;
}

const poemLines = [
  "Donde la noche florece...",
  "y las estrellas brillan,",
  "siempre hay un secreto..."
];

function drawPoem(t) {
  if (t < 3500) return;
  
  const totalChars = poemLines.join('\n').length;
  const p = clamp((t - 3500) / 6500, 0, 1);
  const charsToShow = Math.floor(p * totalChars);

  ctx.save();
  
  // Easter Egg 128 √e980 centrado arriba, cortado por un cuchillo láser y revelando I LOVE YOU
  if (t > 6500) {
    const alphaEgg = clamp((t - 6500) / 1500, 0, 1);
    ctx.globalAlpha = alphaEgg * 0.9;
    const cx = W / 2;
    const cy = 45;

    if (t > 15000 && t < 15500) {
      // Destello del corte de cuchillo láser
      const cutP = (t - 15000) / 500;
      ctx.save();
      ctx.strokeStyle = '#00f5ff';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00f5ff';
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.moveTo(cx - 200 + cutP * 400, cy - 25);
      ctx.lineTo(cx - 180 + cutP * 400, cy + 25);
      ctx.stroke();
      ctx.restore();
    }

    if (t > 15300) {
      const revealP = clamp((t - 15300) / 800, 0, 1);
      ctx.save();
      ctx.globalAlpha = alphaEgg * revealP;
      ctx.shadowColor = '#ff00d4';
      ctx.shadowBlur = 25 * revealP;
      ctx.fillStyle = '#ff00d4';
      ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('❤ I LOVE YOU ❤', cx, cy);
      ctx.shadowBlur = 0;
      ctx.restore();
    } else {
      ctx.save();
      ctx.shadowColor = '#00f5ff';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#00f5ff';
      ctx.font = '600 20px monospace';
      ctx.textAlign = 'center';

      if (t > 14700) {
        // Mitades separándose antes del corte
        const splitOffset = (t - 14700) * 0.2;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, cx, 100);
        ctx.clip();
        ctx.fillText('128 √e980', cx - splitOffset, cy);
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.rect(cx, 0, W - cx, 100);
        ctx.clip();
        ctx.fillText('128 √e980', cx + splitOffset, cy);
        ctx.restore();
      } else {
        ctx.fillText('128 √e980', cx, cy);
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  // Poema estilo máquina de escribir
  let currentCount = 0;
  let linesToDraw = [];
  for (const line of poemLines) {
    if (currentCount >= charsToShow) break;
    const remaining = charsToShow - currentCount;
    if (remaining >= line.length) {
      linesToDraw.push(line);
      currentCount += line.length + 1;
    } else {
      linesToDraw.push(line.substring(0, remaining));
      currentCount += remaining;
      break;
    }
  }

  ctx.shadowColor = '#ff00d4';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff73e6';
  ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';

  let startY = H - 55 - (linesToDraw.length * 22);
  for (let i = 0; i < linesToDraw.length; i++) {
    ctx.globalAlpha = 0.9;
    ctx.fillText(linesToDraw[i], W / 2, startY + (i * 22));
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function frame(now) {
  const t = now - t0;
  const dt = Math.min(0.05, (now - lastNow) / 1000);
  lastNow = now;

  let bass = 0;
  if (!bgm.paused && musicStarted) {
    bass = Math.max(0, Math.sin(t * 0.007)) * 0.5 + Math.max(0, Math.sin(t * 0.014)) * 0.3;
  }

  if (t > 1500 && t < 5000 && dt > 0) { fpsSum += dt; fpsN++; }
  if (!fpsChecked && t >= 5200) pruneLeaves();

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (bass > 0.02) {
    ctx.save();
    ctx.translate(W / 2, H / 2);
    const sc = 1 + bass * 0.025;
    ctx.scale(sc, sc);
    ctx.translate(-W / 2, -H / 2);
  }

  drawSky(t);
  drawMoon(t);
  updateAndDrawSnow(snowBack, dt, t, 'rgba(200,224,255,1)');

  if (ready) {
    drawTree(t);
    drawGround();
    drawSprout(t);
    drawLeaves(t);
    drawWord(t);
    drawPoem(t);
  }

  updateFireworks(t, dt);
  drawFireworks(t);

  updateAndDrawSnow(snowFront, dt, t, '#ffffff');

  if (bass > 0.04) {
    ctx.restore();
  }

  if (t > T.restart) { start(); return; }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('click', start);
window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') start(); });

const bgm = document.getElementById('bgm');
const mBtn = document.getElementById('music-btn');
let musicStarted = false;

function toggleMusic(e) {
  if (e) e.stopPropagation();
  if (bgm.paused) {
    bgm.play().then(() => {
      musicStarted = true;
      mBtn.classList.add('playing');
      mBtn.textContent = '🔊';
    }).catch(err => console.log("Error reproduciendo:", err));
  } else {
    bgm.pause();
    mBtn.classList.remove('playing');
    mBtn.textContent = '🎵';
  }
}

mBtn.addEventListener('click', toggleMusic);

window.addEventListener('click', () => {
  if (!musicStarted) {
    bgm.play().then(() => {
      musicStarted = true;
      mBtn.classList.add('playing');
      mBtn.textContent = '🔊';
    }).catch(() => {});
  }
}, { once: true });

resize();
requestAnimationFrame(frame);
</script>
</body>
