<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nixy Tree</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
  canvas{display:block}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;
        font:600 13px "Segoe UI",system-ui,sans-serif;color:#4ad6c8;
        letter-spacing:2px;opacity:.55;pointer-events:none;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click o tecla R para repetir</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width = Math.floor(W * DPR);
  cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  start();
}

const PAL = ['#00f5ff', '#ff00d4', '#b6ff00', '#ff9b00', '#ff2d95', '#9d4bff', '#39ff88'];

const T = {
  sprout: 1000,
  growStart: 1000,
  growEnd: 5200,
  bloomStart: 4300,
  fallAt: 7600,
  wordIn: 10600,
  wordFull: 12400,
  restart: 18500
};

let branches = [], leaves = [], wordPts = [], glowSprites = {}, base = { x: 0, y: 0 };
let wordFont = '', t0 = 0, ready = false;

function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeInQuad(t) { return t * t; }
function easeOutBack(t) { const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

function initGlow() {
  glowSprites = {};
  for (const col of PAL) {
    const s = document.createElement('canvas');
    s.width = s.height = 64;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, col);
    grad.addColorStop(0.35, col + 'aa');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    glowSprites[col] = s;
  }
}

function addLeaf(x, y, depth) {
  leaves.push({
    x, y, depth,
    color: PAL[(Math.random() * PAL.length) | 0],
    size: rnd(5, 8.5),
    rot: Math.random() * Math.PI * 2,
    spin: rnd(-4, 4),
    ph: Math.random() * Math.PI * 2,
    amp: rnd(5, 28),
    finalRot: rnd(-0.6, 0.6),
    bloomAt: 0, bloomDur: 750,
    fallT0: 0, fallDur: 0, settleDur: 0,
    sx: 0, sy: 0, mx: 0, my: 0, tx: 0, ty: 0,
    started: false
  });
}

function buildTree() {
  branches = [];
  leaves = [];
  base = { x: W / 2, y: H * 0.93 };

  function grow(x, y, ang, len, depth, tt0) {
    if (branches.length > 1400) return;
    const dur = 200 + len * 1.15;
    const tt1 = tt0 + dur;
    const x2 = x + Math.cos(ang) * len;
    const y2 = y + Math.sin(ang) * len;
    branches.push({ x, y, x2, y2, len, depth, t0: tt0, t1: tt1 });

    if (depth >= 7 || len < 11) { addLeaf(x2, y2, depth); return; }

    if (depth >= 4 && Math.random() < 0.65) addLeaf(x2, y2, depth);

    const n = depth < 2 ? 2 : (Math.random() < 0.62 ? 2 : 3);
    for (let i = 0; i < n; i++) {
      const spread = 0.5 + depth * 0.06;
      const a = ang + rnd(-spread, spread) + (ang > -Math.PI / 2 ? 0.04 : -0.04);
      grow(x2, y2, a, len * rnd(0.66, 0.82), depth + 1, tt0 + dur * 0.72);
    }
  }

  grow(base.x, base.y, -Math.PI / 2, H * 0.15, 0, 0);

  let maxT = 0;
  for (const b of branches) maxT = Math.max(maxT, b.t1);
  const scale = (T.growEnd - T.growStart) / maxT;
  for (const b of branches) { b.t0 = T.growStart + b.t0 * scale; b.t1 = T.growStart + b.t1 * scale; }

  if (leaves.length < 380) {
    for (let i = 0; i < 400 && leaves.length < 500; i++) {
      const b = branches[(Math.random() * branches.length) | 0];
      if (b.depth < 3) continue;
      const p = rnd(0.4, 1);
      addLeaf(lerp(b.x, b.x2, p), lerp(b.y, b.y2, p), b.depth);
    }
  }

  for (const l of leaves) {
    l.bloomAt = T.bloomStart + rnd(0, 1500) + (l.depth >= 6 ? 400 : 0);
    l.fallT0 = T.fallAt + rnd(0, 950);
    l.fallDur = rnd(1400, 2000);
    l.settleDur = rnd(700, 1150);
  }
}

function buildWord() {
  const off = document.createElement('canvas');
  off.width = Math.floor(W);
  off.height = Math.floor(H);
  const o = off.getContext('2d');
  const size = Math.min(W * 0.30, H * 0.44);
  wordFont = 'italic 900 ' + size + 'px "Segoe UI", Arial, sans-serif';
  o.font = wordFont;
  o.textAlign = 'center';
  o.textBaseline = 'middle';
  o.fillStyle = '#fff';
  o.fillText('Nixy', W / 2, H * 0.56);

  const d = o.getImageData(0, 0, off.width, off.height).data;
  const pts = [];
  const step = 4;
  for (let y = 0; y < off.height; y += step) {
    for (let x = 0; x < off.width; x += step) {
      if (d[(y * off.width + x) * 4 + 3] > 128) pts.push({ x, y });
    }
  }
  for (let i = pts.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp;
  }
  wordPts = pts;

  for (let i = 0; i < leaves.length; i++) {
    const p = pts.length ? pts[i % pts.length] : { x: W / 2, y: H * 2 };
    const jx = i >= pts.length ? rnd(-4, 4) : 0;
    const jy = i >= pts.length ? rnd(-4, 4) : 0;
    leaves[i].tx = p.x + jx;
    leaves[i].ty = p.y + jy;
  }
}

function start() {
  initGlow();
  buildTree();
  buildWord();
  ready = branches.length > 0 && leaves.length > 0;
  t0 = performance.now();
}

function swayAt(t) {
  if (t < T.fallAt) return Math.sin(t * 0.0011) * 0.015;
  const k = clamp((t - T.fallAt) / 1500, 0, 1);
  return Math.sin(T.fallAt * 0.0011) * 0.015 * (1 - k);
}

function rot(px, py, ang) {
  const dx = px - base.x, dy = py - base.y;
  const c = Math.cos(ang), s = Math.sin(ang);
  return { x: base.x + dx * c - dy * s, y: base.y + dx * s + dy * c };
}

function line(x1, y1, x2, y2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawSprout(t) {
  const p = clamp(t / T.sprout, 0, 1);
  const fade = 1 - clamp((t - 1300) / 900, 0, 1);
  if (fade <= 0) return;

  ctx.save();
  ctx.globalAlpha = fade;

  // semilla
  ctx.beginPath();
  ctx.ellipse(base.x, base.y + 4, 9, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#0d3b2e';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#39ff88';
  ctx.globalAlpha = fade * 0.9;
  ctx.stroke();

  // tallo
  const top = base.y - H * 0.05 * p;
  ctx.globalAlpha = fade;
  ctx.lineCap = 'round';
  ctx.lineWidth = 6;
  ctx.strokeStyle = 'rgba(57,255,136,0.25)';
  line(base.x, base.y, base.x, top);
  ctx.lineWidth = 2.6;
  ctx.strokeStyle = '#39ff88';
  line(base.x, base.y, base.x, top);

  // dos hojitas
  if (p > 0.45) {
    const hp = clamp((p - 0.45) / 0.55, 0, 1);
    const s = 7 * hp;
    ctx.fillStyle = '#b6ff00';
    ctx.shadowColor = '#b6ff00';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.ellipse(base.x - s, top + s * 0.4, s, s * 0.5, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(base.x + s, top + s * 0.4, s, s * 0.5, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawTree(t) {
  const ang = swayAt(t);
  ctx.save();
  ctx.translate(base.x, base.y);
  ctx.rotate(ang);
  ctx.translate(-base.x, -base.y);
  ctx.lineCap = 'round';

  for (const b of branches) {
    if (t < b.t0) continue;
    const p = clamp((t - b.t0) / (b.t1 - b.t0), 0, 1);
    const ex = lerp(b.x, b.x2, p);
    const ey = lerp(b.y, b.y2, p);
    const w = Math.max(1.4, (8 - b.depth) * 1.6);
    const hue = 175 + b.depth * 22;
    const col = 'hsl(' + hue + ',100%,55%)';
    const hot = 'hsl(' + hue + ',100%,82%)';

    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.20;
    ctx.lineWidth = w * 3.4;
    line(b.x, b.y, ex, ey);

    ctx.globalAlpha = 0.95;
    ctx.lineWidth = w;
    line(b.x, b.y, ex, ey);

    ctx.globalAlpha = 1;
    ctx.lineWidth = Math.max(0.8, w * 0.32);
    ctx.strokeStyle = hot;
    line(b.x, b.y, ex, ey);

    if (p > 0 && p < 1) {
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = hot;
      ctx.beginPath();
      ctx.arc(ex, ey, w * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawLeaf(x, y, size, rot0, color, scale, alpha) {
  const g = glowSprites[color];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot0);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha * 0.85;
  if (g) ctx.drawImage(g, -size * 2.4, -size * 2.4, size * 4.8, size * 4.8);
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.ellipse(0, 0, size, size * 0.55, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.globalAlpha = alpha * 0.6;
  ctx.beginPath();
  ctx.ellipse(-size * 0.2, -size * 0.12, size * 0.45, size * 0.24, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();
}

function drawLeaves(t) {
  const ang = swayAt(t);
  const wordScale = clamp(W * 0.00062, 0.5, 0.95);

  for (const l of leaves) {
    if (t < l.bloomAt) continue;
    const bp = clamp((t - l.bloomAt) / l.bloomDur, 0, 1);
    const bloom = bp < 1 ? easeOutBack(bp) : 1;
    const pulse = 1 + Math.sin(t * 0.004 + l.ph) * 0.07;

    let x, y, r, sc, alpha;

    if (t < l.fallT0) {
      const p = rot(l.x, l.y, ang);
      x = p.x; y = p.y; r = l.rot + Math.sin(t * 0.002 + l.ph) * 0.25;
      sc = bloom * pulse; alpha = bp;
    } else {
      if (!l.started) {
        l.started = true;
        const p = rot(l.x, l.y, ang);
        l.sx = p.x; l.sy = p.y;
        l.mx = l.tx + rnd(-45, 45);
        l.my = Math.max(l.ty - rnd(55, 165), l.sy + 12);
      }

      const u = clamp((t - l.fallT0) / l.fallDur, 0, 1);
      if (u < 1) {
        y = lerp(l.sy, l.my, easeInQuad(u));
        x = lerp(l.sx, l.mx, u) + Math.sin(u * Math.PI * 2 + l.ph) * l.amp * (1 - u);
        r = l.rot + u * l.spin;
        sc = pulse; alpha = 1;
      } else {
        const v = clamp((t - l.fallT0 - l.fallDur) / l.settleDur, 0, 1);
        const e = easeOutCubic(v);
        x = lerp(l.mx, l.tx, e);
        y = lerp(l.my, l.ty, e);
        r = lerp(l.rot + l.spin, l.finalRot, e);
        sc = lerp(pulse, wordScale, e);
        alpha = 1;
        if (v >= 1) {
          x += Math.sin(t * 0.002 + l.ph) * 1.5;
          y += Math.cos(t * 0.0017 + l.ph) * 1.5;
        }
      }
    }
    drawLeaf(x, y, l.size, r, l.color, sc, alpha);
  }
  ctx.globalAlpha = 1;
}

function drawWord(t) {
  const a = clamp((t - T.wordIn) / (T.wordFull - T.wordIn), 0, 1);
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a * 0.9;
  ctx.font = wordFont;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = '#00f5ff';
  ctx.shadowBlur = 40 * a;
  ctx.lineWidth = Math.max(2, Math.min(W, H) * 0.004);
  ctx.strokeStyle = 'rgba(255,0,212,' + (0.75 * a) + ')';
  ctx.strokeText('Nixy', W / 2, H * 0.56);
  ctx.fillStyle = 'rgba(233,255,255,' + (0.20 * a) + ')';
  ctx.fillText('Nixy', W / 2, H * 0.56);
  ctx.restore();
}

function frame(now) {
  const t = now - t0;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (ready) {
    drawSprout(t);
    drawTree(t);
    drawLeaves(t);
    drawWord(t);
  }

  if (t > T.restart) { start(); return; }
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('click', start);
window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') start(); });

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
